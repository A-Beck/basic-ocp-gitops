apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: basic-ocp-green
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/A-Beck/basic-ocp-gitops.git
    targetRevision: HEAD
    path: charts/webapp
    helm:
      valueFiles:
        - values-green.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: basic-ocp-green
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
