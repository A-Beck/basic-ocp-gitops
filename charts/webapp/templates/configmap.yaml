apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webapp.fullname" . }}-content
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
data:
  index.html: |
    <!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ .Values.page.message | html }}</title>
        <style>
          html, body { min-height: 100%; }
          body {
            margin: 0;
            display: grid;
            place-items: center;
            background-color: {{ .Values.page.color | quote }};
            color: {{ .Values.page.color | quote }};
            font-family: sans-serif;
          }
          h1 {
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            background: white;
            font-size: clamp(2rem, 8vw, 5rem);
          }
        </style>
      </head>
      <body><h1>{{ .Values.page.message | html }}</h1></body>
    </html>
